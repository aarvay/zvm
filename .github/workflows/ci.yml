name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq libarchive-tools util-linux shellcheck zsh fish expect
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install jq flock shellcheck fish
      - name: Check stock Bash and lint scripts
        run: |
          /bin/bash --version
          if [[ "$RUNNER_OS" == macOS ]]; then
            /bin/bash -c '[[ ${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]} == 3.2 ]]'
          fi
          for script in zvm install.sh completions/zvm-completion.bash scripts/*.sh tests/*.sh; do
            /bin/bash -n "$script"
          done
          shellcheck -x zvm install.sh completions/zvm-completion.bash scripts/*.sh tests/*.sh
      - name: CLI acceptance and completions
        run: |
          ZVM_TEST_BASH=/bin/bash /bin/bash tests/acceptance.sh
          /bin/bash tests/completions.sh
      - name: Build and test release bootstrap
        run: |
          /bin/bash scripts/build-release.sh "$GITHUB_REPOSITORY" "v$(/bin/bash zvm --version)" assets
          /bin/bash tests/installer.sh assets
