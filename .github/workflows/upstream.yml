name: Upstream smoke

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq libarchive-tools util-linux
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install jq flock
      - name: Install and activate the pinned Zig and ZLS pair
        run: /bin/bash tests/live-smoke.sh
